<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
                        <i class="fas fa-check-circle text-blue-600 mr-2"></i>
                        Habit Tracker
                    </h1>
                </div>
                <nav class="flex space-x-4">
                    <a href="/" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
                    <a href="/analytics" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 px-3 py-2 rounded-md text-sm font-medium">Analytics</a>
                    <button id="theme-toggle" class="p-2 rounded-md transition-all duration-300" style="color: var(--text-secondary); border: 1px solid var(--border-color);">
                        <i class="fas fa-moon" id="moon-icon"></i>
                        <i class="fas fa-sun" id="sun-icon" style="display: none;"></i>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 stats-grid">
            <div class="stats-card rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-bullseye text-2xl" style="color: var(--ferrari-red);"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium" style="color: var(--text-tertiary);">Total Habits</p>
                        <p id="total-habits" class="text-2xl font-semibold" style="color: var(--text-primary);">0</p>
                    </div>
                </div>
            </div>
            
            <div class="stats-card rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-calendar-check text-2xl" style="color: #10b981;"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium" style="color: var(--text-tertiary);">Today's Progress</p>
                        <p id="today-progress" class="text-2xl font-semibold" style="color: var(--text-primary);">0/0</p>
                    </div>
                </div>
            </div>
            
            <div class="stats-card rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-percentage text-2xl" style="color: var(--ferrari-gold);"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium" style="color: var(--text-tertiary);">Success Rate</p>
                        <p id="success-rate" class="text-2xl font-semibold" style="color: var(--text-primary);">0%</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Habit Form -->
        <div class="stats-card rounded-lg shadow mb-8">
            <div class="px-6 py-4" style="border-bottom: 1px solid var(--border-color);">
                <h2 class="text-lg font-medium" style="color: var(--text-primary);">Add New Habit</h2>
            </div>
            <div class="p-6">
                <form id="habit-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="habit-name" class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Habit Name</label>
                            <input type="text" id="habit-name" required class="form-input w-full px-3 py-2 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="habit-icon" class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Icon</label>
                            <select id="habit-icon" class="form-input w-full px-3 py-2 rounded-md shadow-sm">
                                <option value="fas fa-dumbbell">🏋️ Exercise</option>
                                <option value="fas fa-book">📚 Reading</option>
                                <option value="fas fa-tint">💧 Water</option>
                                <option value="fas fa-bed">😴 Sleep</option>
                                <option value="fas fa-apple-alt">🍎 Healthy Eating</option>
                                <option value="fas fa-walking">🚶 Walking</option>
                                <option value="fas fa-brain">🧠 Meditation</option>
                                <option value="fas fa-code">💻 Coding</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button type="submit" class="btn-ferrari w-full py-2 px-4 rounded-md">
                                <i class="fas fa-plus mr-2"></i>Add Habit
                            </button>
                        </div>
                    </div>
                    <div>
                        <label for="habit-description" class="block text-sm font-medium mb-2" style="color: var(--text-secondary);">Description (Optional)</label>
                        <input type="text" id="habit-description" class="form-input w-full px-3 py-2 rounded-md shadow-sm">
                    </div>
                </form>
            </div>
        </div>

        <!-- Habits List -->
        <div class="stats-card rounded-lg shadow">
            <div class="px-6 py-4" style="border-bottom: 1px solid var(--border-color);">
                <h2 class="text-lg font-medium" style="color: var(--text-primary);">Today's Habits</h2>
            </div>
            <div id="habits-list" class="p-6">
                <!-- Habits will be loaded here -->
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
